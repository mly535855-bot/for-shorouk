<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Shūrouk 🤍</title>
    
    <!-- استدعاء الخطوط الفاخرة للويب من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@200;300;400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* -------------------------------------------------- */
        /* 1. ARCHITECTURE & VARIABLES (الهندسة والألوان)      */
        /* -------------------------------------------------- */
        :root {
            --baby-blue: #e0f2fe;      
            --sky-accent: #bae6fd;     
            --sky-glow: rgba(186, 230, 253, 0.4);
            --powder-pink: #fce7f3;    
            --pink-accent: #fbcfe8;    
            --pink-glow: rgba(251, 207, 232, 0.3);
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #475569;
            --card-bg: rgba(255, 255, 255, 0.42);
            --card-border: rgba(255, 255, 255, 0.65);
            --transition-smooth: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Reset & Global Overrides */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--baby-blue) 0%, var(--powder-pink) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* -------------------------------------------------- */
        /* 2. ADVANCED BACKGROUND PARTICLES (محرك جزيئات فلكي) */
        /* -------------------------------------------------- */
        #interactive-space {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
        }

        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            filter: blur(80px);
            opacity: 0.6;
            will-change: transform;
        }

        .glow-blue {
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, var(--sky-glow) 0%, rgba(0,0,0,0) 70%);
            animation: driftGlow 25s infinite alternate ease-in-out;
        }

        .glow-pink {
            bottom: -200px;
            left: -200px;
            background: radial-gradient(circle, var(--pink-glow) 0%, rgba(0,0,0,0) 70%);
            animation: driftGlow 30s infinite alternate-reverse ease-in-out;
        }

        @keyframes driftGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.15); }
        }

        /* -------------------------------------------------- */
        /* 3. LAYOUT & GLASSMORPHISM CONTAINERS               */
        /* -------------------------------------------------- */
        .viewport-section {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            z-index: 10;
        }

        .luxury-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 50px 35px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(31, 38, 135, 0.04),
                        inset 0 0 20px rgba(255, 255, 255, 0.3);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.1s ease, box-shadow 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .luxury-card:hover {
            box-shadow: 0 20px 60px rgba(31, 38, 135, 0.08);
        }

        /* -------------------------------------------------- */
        /* 4. BUTTON ARCHITECTURE (هندسة الأزرار والتفاعلات)   */
        /* -------------------------------------------------- */
        .btn-wrapper {
            position: relative;
            display: inline-block;
            margin: 25px 0;
        }

        .interactive-btn {
            background: var(--white);
            color: var(--text-dark);
            border: 1px solid rgba(255, 255, 255, 0.9);
            font-family: 'Cairo', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 14px 45px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.03);
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.5px;
            z-index: 5;
        }

        .interactive-btn:hover {
            transform: translateY(-4px) scale(1.02);
            background: linear-gradient(135deg, var(--white) 0%, var(--sky-accent) 100%);
            box-shadow: 0 12px 30px rgba(186, 230, 253, 0.5);
        }

        .interactive-btn:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* -------------------------------------------------- */
        /* 5. TYPOGRAPHY & MOTIONS (الحركات والخطوط)          */
        /* -------------------------------------------------- */
        .welcome-screen-container {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: opacity, transform;
        }

        .welcome-screen-container.fade-out {
            opacity: 0;
            transform: scale(0.92) translateY(-30px);
            pointer-events: none;
            position: absolute;
        }

        .title-primary {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            animation: calmPulse 4s infinite ease-in-out;
        }

        .tagline-sub {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        @keyframes calmPulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.02); opacity: 1; }
        }

        /* -------------------------------------------------- */
        /* 6. MAIN CONTENT JOURNEY (المحتوى الرئيسي للرحلة)    */
        /* -------------------------------------------------- */
        #journey-manifesto {
            display: none;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            flex-direction: column;
            gap: 45px;
            width: 100%;
        }

        #journey-manifesto.fade-in {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        /* الرسالة الأدبية الكاتبة */
        .literary-box {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            line-height: 2.1;
            color: var(--text-dark);
            text-align: justify;
            text-justify: inter-word;
            min-height: 180px;
            padding: 10px 5px;
            position: relative;
        }

        /* -------------------------------------------------- */
        /* 7. LIVE METRIC COUNTER (نظام العداد الزمني الحي)    */
        /* -------------------------------------------------- */
        .metric-headline {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .metric-block {
            background: rgba(255, 255, 255, 0.45);
            padding: 15px 5px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }

        .metric-block:hover {
            transform: translateY(-2px);
        }

        .metric-number {
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--text-dark);
            display: block;
            font-family: 'Playfair Display', serif;
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* -------------------------------------------------- */
        /* 8. VISUAL PLACEHOLDERS (إطارات الصور المرفوعة)       */
        /* -------------------------------------------------- */
        .canvas-frame {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, var(--sky-accent), var(--powder-pink));
            border-radius: 20px;
            margin: 20px 0 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        .canvas-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.5s ease;
        }

        .canvas-frame:hover img {
            transform: scale(1.04);
        }

        /* -------------------------------------------------- */
        /* 9. SECRET SYSTEM SURPRISE (نظام المفاجأة الإضافي)    */
        /* -------------------------------------------------- */
        .hidden-vault {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hidden-vault.unlocked {
            max-height: 350px;
            opacity: 1;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.8);
        }

        /* -------------------------------------------------- */
        /* 10. LUXURY SIGNATURE & BRANDING (التوقيع والنهاية) */
        /* -------------------------------------------------- */
        .brand-epilogue {
            margin-top: 45px;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            padding-top: 30px;
            position: relative;
        }

        .brand-epilogue::before {
            content: '✨';
            position: absolute;
            top: -12px;
            left: calc(50% - 10px);
            background: transparent;
            font-size: 0.9rem;
        }

        .meta-shurouk {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .meta-thankyou {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .meta-mahmoud {
            margin-top: 20px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-dark);
        }

        /* -------------------------------------------------- */
        /* 11. AUDIO ENGINE WIDGETS (مشغل ومتحكم الصوت)        */
        /* -------------------------------------------------- */
        .audio-suite-anchor {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 999;
        }

        .audio-trigger {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: var(--transition-smooth);
        }

        .audio-trigger:hover {
            transform: scale(1.1);
            background: var(--white);
        }

        /* -------------------------------------------------- */
        /* 12. FLOATING KINETIC HEARTS (محرك القلوب الحركي)   */
        /* -------------------------------------------------- */
        .kinetic-heart {
            position: fixed;
            bottom: -60px;
            pointer-events: none;
            z-index: 3;
            will-change: transform, opacity;
            animation: streamUp linear forwards;
        }

        @keyframes streamUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.4);
                opacity: 0;
            }
            15% {
                opacity: 0.7;
                transform: translateY(-10vh) translateX(calc(var(--drift-x) * 0.2)) rotate(20deg) scale(1);
            }
            85% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-110vh) translateX(var(--drift-x)) rotate(360deg) scale(0.75);
                opacity: 0;
            }
        }

        /* الاستجابة للهواتف (Responsive Engine) */
        @media(max-width: 480px) {
            .luxury-card {
                padding: 40px 20px;
            }
            .title-primary {
                font-size: 2.4rem;
            }
            .literary-box {
                font-size: 1.35rem;
            }
            .metric-number {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

    <!-- متحكم الصوت الاحترافي المدمج -->
    <div class="audio-suite-anchor">
        <button class="audio-trigger" id="masterAudioBtn" onclick="orchestrateAudioToggle()" title="تحكم بالصوت">
            <span id="audio-state-indicator">🎵</span>
        </button>
    </div>

    <!-- كائن هندسة الصوت - سيبحث تلقائياً عن ملف music.mp3 في المجلد الرئيسي -->
    <audio id="romanticSuiteNode" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- نظام المحاكاة البصرية الفلكية والجزيئية -->
    <canvas id="interactive-space"></canvas>
    <div class="ambient-glow glow-blue"></div>
    <div class="ambient-glow glow-pink"></div>

    <!-- ================================================== -->
    <!-- الشاشة الأولى: الصفحة الافتتاحية للموقع              -->
    <!-- ================================================== -->
    <div class="viewport-section welcome-screen-container" id="gateway-view">
        <div class="luxury-card" id="welcomeCard">
            <h1 class="title-primary">For Shūrouk 🤍</h1>
            <p class="subtitle tagline-sub">This page was made especially for one person.</p>
            
            <div class="btn-wrapper">
                <button class="interactive-btn" onclick="initializeGrandJourney()">ابدئي الرحلة 🌹</button>
            </div>
        </div>
    </div>

    <!-- ================================================== -->
    <!-- الشاشة الثانية: واجهة المحتوى المتكامل والرحلة        -->
    <!-- ================================================== -->
    <div class="viewport-section" id="journey-manifesto">
        
        <!-- القسم الأدبي الأول: الرسالة المكتوبة آلياً -->
        <div class="luxury-card tilt-target">
            <div class="canvas-frame">
                <!-- هنا تم ربط الصورة الأولى مباشرة pic1.jpg المرفوعة من قبلك -->
                <img src="pic1.jpg" alt="Shurouk Memory">
            </div>

            <!-- حاوية نص الرسالة الأدبية الفصيحة -->
            <div class="literary-box" id="dynamic-text-node"></div>
        </div>

        <!-- القسم الإحصائي الثاني: العداد الزمني والزر الخاص السري -->
        <div class="luxury-card tilt-target">
            <h3 class="metric-headline">اللحظات الجميلة التي عشناها معًا 🌌</h3>
            
            <!-- شبكة العداد الزمني المتطور -->
            <div class="metric-grid">
                <div class="metric-block">
                    <span class="metric-number" id="node-days">00</span>
                    <span class="metric-label">يوم</span>
                </div>
                <div class="metric-block">
                    <span class="metric-number" id="node-hours">00</span>
                    <span class="metric-label">ساعة</span>
                </div>
                <div class="metric-block">
                    <span class="metric-number" id="node-minutes">00</span>
                    <span class="metric-label">دقيقة</span>
                </div>
                <div class="metric-block">
                    <span class="metric-number" id="node-seconds">00</span>
                    <span class="metric-label">ثانية</span>
                </div>
            </div>

            <div class="canvas-frame" style="height: 190px;">
                <!-- هنا تم ربط الصورة الثانية مباشرة pic2.jpg المرفوعة من قبلك -->
                <img src="pic2.jpg" alt="Shurouk Vector">
            </div>

            <div class="btn-wrapper">
                <button class="interactive-btn" id="triggerSurpriseNodeBtn" onclick="executeVaultSurprise()">اضغطي هنا 🤍</button>
            </div>

            <!-- الرسالة المخفية والسرية الثانية -->
            <div class="hidden-vault" id="vaultContentBlock">
                <p style="font-family: 'Amiri', serif; font-size: 1.35rem; line-height: 1.9; color: var(--text-dark);">
                    "وفي كل يوم يمر، أجد في تفاصيلكِ ما يجعلني ممتنًا للأقدار أكثر.. دمتِ لي شيئاً جميلاً لا ينتهي." ✨🩵
                </p>
            </div>

            <!-- الخاتمة والبراند والتوقيع الفاخر -->
            <div class="brand-epilogue">
                <div class="meta-shurouk">شُروق 🤍</div>
                <div class="meta-thankyou">شكراً لأنكِ موجودة في حياتي.</div>
                <div class="meta-mahmoud">— محمود</div>
            </div>
        </div>

    </div>

    <!-- ================================================== -->
    <!-- الأنظمة والمحركات البرمجية المتقدمة (JAVASCRIPT)     -->
    <!-- ================================================== -->
    <script>
        // --------------------------------------------------
        // أ. محرك الجزيئات الفلكية المتقدم (Advanced Particle Space Engine)
        // --------------------------------------------------
        const spaceCanvas = document.getElementById('interactive-space');
        const spaceCtx = spaceCanvas.getContext('2d');
        let spaceStars = [];
        const totalSpaceStars = 90;

        function configureSpaceDimensions() {
            spaceCanvas.width = window.innerWidth;
            spaceCanvas.height = window.innerHeight;
            generateSpaceSystem();
        }

        class CosmicStar {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * spaceCanvas.width;
                this.y = Math.random() * spaceCanvas.height;
                this.radius = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random();
                this.velocity = Math.random() * 0.015 + 0.005;
                this.direction = Math.random() > 0.5 ? 1 : -1;
            }
            process() {
                this.alpha += this.velocity * this.direction;
                if (this.alpha > 1 || this.alpha < 0.1) {
                    this.direction *= -1;
                }
            }
            render() {
                spaceCtx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                spaceCtx.beginPath();
                spaceCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                spaceCtx.fill();
            }
        }

        function generateSpaceSystem() {
            spaceStars = [];
            for (let i = 0; i < totalSpaceStars; i++) {
                spaceStars.push(new CosmicStar());
            }
        }

        function loopSpaceAnimation() {
            spaceCtx.clearRect(0, 0, spaceCanvas.width, spaceCanvas.height);
            spaceStars.forEach(star => {
                star.process();
                star.render();
            });
            requestAnimationFrame(loopSpaceAnimation);
        }

        window.addEventListener('resize', configureSpaceDimensions);
        configureSpaceDimensions();
        loopSpaceAnimation();

        // --------------------------------------------------
        // ب. نظام الصوت الاحترافي وحل قيود المتصفحات
        // --------------------------------------------------
        const audioNode = document.getElementById('romanticSuiteNode');
        const audioIndicatorNode = document.getElementById('audio-state-indicator');
        let audioSystemActive = false;

        function orchestrateAudioToggle() {
            if (audioSystemActive) {
                audioNode.pause();
                audioIndicatorNode.innerText = "🔇";
                audioSystemActive = false;
            } else {
                audioNode.play().then(() => {
                    audioIndicatorNode.innerText = "🎵";
                    audioSystemActive = true;
                }).catch(() => {
                    console.log("Audio pipeline blocked by browser security policy.");
                });
            }
        }

        function forceAudioBoot() {
            audioNode.play().then(() => {
                audioSystemActive = true;
                audioIndicatorNode.innerText = "🎵";
            }).catch(() => {});
        }

        // --------------------------------------------------
        // ج. تشغيل الرحلة وتأثيرات الكتابة السينمائية
        // --------------------------------------------------
        const masterManifestoString = "إلى شروق.. في زحام هذه الحياة العابرة، تظل هناك تفاصيل صغيرة تصنع فارقاً كبيراً في أيامنا. وجودكِ في حياتي يشبه ذلك الفارق المبهج؛ كأنه النور الهادئ الذي يضفي السكينة على كل شيء يمر به. لستِ مجرد عابرة، بل أنتِ الجزء الجميل، النقي، والراقٍ الذي أحمد الله على وجوده بكل صدق.. 🤍";
        
        function initializeGrandJourney() {
            forceAudioBoot();

            // خروج ناعم لشاشة الاستقبال
            document.getElementById('gateway-view').classList.add('fade-out');
            
            // دخول ناعم ومجدول للرحلة بالكامل
            const mainViewNode = document.getElementById('journey-manifesto');
            mainViewNode.classList.add('fade-in');

            // تفعيل نظام توليد القلوب المستدام بالخلفية
            setInterval(() => { executeKineticHeartGeneration(false); }, 750);

            // تفعيل نظام المحاكاة التفاعلي للكروت ثلاثي الأبعاد للهواتف الذكية والكمبيوتر
            setupInteractiveCardTilt();

            // بدء الآلة الكاتبة بدقة عالية بعد انتهاء التحول البصري
            setTimeout(() => {
                executeCinematicTypewriter(masterManifestoString, 'dynamic-text-node', 60);
            }, 900);
        }

        function executeCinematicTypewriter(text, targetId, delayInterval) {
            const outputContainer = document.getElementById(targetId);
            outputContainer.innerHTML = "";
            let textCursorIndex = 0;

            function stream() {
                if (textCursorIndex < text.length) {
                    outputContainer.innerHTML += text.charAt(textCursorIndex);
                    textCursorIndex++;
                    setTimeout(stream, delayInterval);
                }
            }
            stream();
        }

        // --------------------------------------------------
        // د. نظام ومحرك العداد الزمني الدقيق (24 يونيو 2026)
        // --------------------------------------------------
        const epochTimestamp = new Date("June 24, 2026 00:00:00").getTime();

        function syncChronometerMetrics() {
            const temporalNow = new Date().getTime();
            const elapsedTimeDelta = temporalNow - epochTimestamp;

            // حسابات الوقت التفصيلية والمنقضية
            const calculatedDays = Math.floor(elapsedTimeDelta / (1000 * 60 * 60 * 24));
            const calculatedHours = Math.floor((elapsedTimeDelta % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const calculatedMinutes = Math.floor((elapsedTimeDelta % (1000 * 60 * 60)) / (1000 * 60));
            const calculatedSeconds = Math.floor((elapsedTimeDelta % (1000 * 60)) / 1000);

            // حقن البيانات في واجهة الـ DOM
            document.getElementById('node-days').innerText = calculatedDays < 10 ? '0' + calculatedDays : calculatedDays;
            document.getElementById('node-hours').innerText = calculatedHours < 10 ? '0' + calculatedHours : calculatedHours;
            document.getElementById('node-minutes').innerText = calculatedMinutes < 10 ? '0' + calculatedMinutes : calculatedMinutes;
            document.getElementById('node-seconds').innerText = calculatedSeconds < 10 ? '0' + calculatedSeconds : calculatedSeconds;
        }

        setInterval(syncChronometerMetrics, 1000);
        syncChronometerMetrics();

        // --------------------------------------------------
        // هـ. تشغيل الخزنة السرية وعاصفة القلوب المكثفة
        // --------------------------------------------------
        function executeVaultSurprise() {
            if (!audioSystemActive) { orchestrateAudioToggle(); }

            // فتح الصندوق السري السفلي بسلاسة
            document.getElementById('vaultContentBlock').classList.add('unlocked');

            // إطلاق عاصفة قلوب مكثفة وحركية سريعة
            for (let index = 0; index < 25; index++) {
                setTimeout(() => { executeKineticHeartGeneration(true); }, index * 120);
            }
        }

        // --------------------------------------------------
        // و. دالة بناء وتوليد جزيئات القلوب الحركية (🤍 و 🩵)
        // --------------------------------------------------
        function executeKineticHeartGeneration(isHighIntensity) {
            const heartNode = document.createElement('div');
            heartNode.classList.add('kinetic-heart');
            
            const variantPalette = ['🤍', '🩵'];
            heartNode.innerText = variantPalette[Math.floor(Math.random() * variantPalette.length)];
            
            // حساب الإحداثيات العشوائية والفيزيائية
            heartNode.style.left = Math.random() * 100 + 'vw';
            const nodeSize = Math.random() * 16 + 16; 
            heartNode.style.fontSize = nodeSize + 'px';
            
            const lifespanDuration = isHighIntensity ? (Math.random() * 2.5 + 3) : (Math.random() * 4 + 5);
            heartNode.style.animationDuration = lifespanDuration + 's';
            
            const calculatedDriftX = (Math.random() * 120 - 60) + 'px';
            heartNode.style.setProperty('--drift-x', calculatedDriftX);

            document.body.appendChild(heartNode);

            // تدمير فوري لعنصر الـ DOM بعد انتهاء الحركة لحفظ أداء الهواتف
            setTimeout(() => {
                heartNode.remove();
            }, lifespanDuration * 1000);
        }

        // --------------------------------------------------
        // ز. محرك الـ 3D Parallax Tilt للأجهزة والماوس
        // --------------------------------------------------
        function setupInteractiveCardTilt() {
            const targetCards = document.querySelectorAll('.tilt-target');
            
            if (window.innerWidth > 768) {
                targetCards.forEach(card => {
                    card.addEventListener('mousemove', (e) => {
                        const bounding = card.getBoundingClientRect();
                        const x = e.clientX - bounding.left;
                        const y = e.clientY - bounding.top;
                        const xc = bounding.width / 2;
                        const yc = bounding.height / 2;
                        const tiltX = (yc - y) / 12;
                        const tiltY = (x - xc) / 12;
                        card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateY(-5px)`;
                    });

                    card.addEventListener('mouseleave', () => {
                        card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
                    });
                });
            }
        }
    </script>
</body>
